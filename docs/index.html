<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharos Wake</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-bg: #0d1117;
    --color-text: #e6edf3;
    --color-text-muted: #7d8590;
    --color-success: #3fb950;
    --color-warning: #d29922;
    --color-error: #f85149;
    --color-border: rgba(255,255,255,0.08);
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  html, body { height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-mono); }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 480px; padding: 2rem; }
  .badge { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 2rem; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-muted); }
  h1 { font-size: 1rem; font-weight: 600; color: var(--color-text); margin-bottom: 0.4rem; }
  .url { font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 2rem; word-break: break-all; }
  .status-row { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border: 1px solid var(--color-border); border-radius: 6px; margin-bottom: 1rem; }
  .indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--color-text-muted); }
  .indicator.ok { background: var(--color-success); box-shadow: 0 0 6px var(--color-success); }
  .indicator.error { background: var(--color-error); }
  .indicator.pinging { background: var(--color-warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 0.8rem; color: var(--color-text-muted); flex: 1; }
  .status-text strong { color: var(--color-text); display: block; font-size: 0.85rem; margin-bottom: 0.1rem; }
  .timestamp { font-size: 0.7rem; color: var(--color-text-muted); }
  .log { border: 1px solid var(--color-border); border-radius: 6px; padding: 0.75rem; max-height: 180px; overflow-y: auto; font-size: 0.7rem; line-height: 1.8; color: var(--color-text-muted); }
  .log-entry.ok { color: var(--color-success); }
  .log-entry.error { color: var(--color-error); }
  .log-entry.info { color: var(--color-text-muted); }
  .meta { margin-top: 1rem; font-size: 0.65rem; color: var(--color-text-muted); opacity: 0.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge"><span class="dot"></span> Pharos Keep-Alive</div>
  <h1>pharos-backend.onrender.com</h1>
  <p class="url">https://pharos-backend-5eew.onrender.com/health</p>
  <div class="status-row">
    <div class="indicator pinging" id="indicator"></div>
    <div class="status-text">
      <strong id="status-label">연결 확인 중...</strong>
      <span id="status-detail">health endpoint polling</span>
    </div>
    <span class="timestamp" id="last-ping">--:--:--</span>
  </div>
  <div class="log" id="log"></div>
  <p class="meta">매 4분마다 자동 폴링 · Render Free Tier cold start 방지</p>
</div>
<script>
const HEALTH_URL = 'https://pharos-backend-5eew.onrender.com/health'
const INTERVAL_MS = 4 * 60 * 1000
const indicator = document.getElementById('indicator')
const statusLabel = document.getElementById('status-label')
const statusDetail = document.getElementById('status-detail')
const lastPing = document.getElementById('last-ping')
const logEl = document.getElementById('log')
function now() { return new Date().toLocaleTimeString('ko-KR', { hour12: false }) }
function addLog(msg, type = 'info') {
  const el = document.createElement('div')
  el.className = `log-entry ${type}`
  el.textContent = `[${now()}] ${msg}`
  logEl.prepend(el)
  while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild)
}
async function ping() {
  indicator.className = 'indicator pinging'
  statusLabel.textContent = '폴링 중...'
  addLog('GET /health', 'info')
  try {
    const res = await fetch(HEALTH_URL, { signal: AbortSignal.timeout(10000) })
    const data = await res.json()
    lastPing.textContent = now()
    if (res.ok) {
      indicator.className = 'indicator ok'
      statusLabel.textContent = '서버 활성'
      statusDetail.textContent = `connections: ${data.connections ?? 0}`
      addLog(`200 OK · connections: ${data.connections ?? 0}`, 'ok')
    } else { throw new Error(`HTTP ${res.status}`) }
  } catch (err) {
    indicator.className = 'indicator error'
    statusLabel.textContent = '응답 없음'
    statusDetail.textContent = err.message
    addLog(`ERR ${err.message}`, 'error')
  }
}
ping()
setInterval(ping, INTERVAL_MS)
</script>
</body>
</html>
